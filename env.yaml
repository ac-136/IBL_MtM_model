name: ibl-fm
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.8
  - pip>=20.3
  - numpy=1.24
  - h5py=3.11.0
  - huggingface_hub
  - pip:
    - pandas
    - tqdm
    - matplotlib
    - seaborn
    - scikit-learn
    - scipy
    - ONE-api
    - iblutil
    - iblatlas
    - wandb
    - ibllib @ git+https://github.com/int-brain-lab/ibllib.git
    - ray[tune]==2.9.3
    - torcheval==0.0.7
    - timm==0.9.16
    - datasets==2.17.1
    - transformers==4.38.2
    - accelerate==0.27.2
    - lightning==2.2.0
    - -e ./src